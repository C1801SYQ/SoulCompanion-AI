name: Product software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt -r requirements-dev.txt
      - run: mkdir -p .test-artifacts
      - run: python -m pytest -q -p no:cacheprovider --basetemp .test-artifacts/pytest
      - run: python scripts/acceptance_smoke.py
      - run: python scripts/hardware_smoke_test.py
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py --out .test-artifacts/site
      - uses: actions/upload-artifact@v4
        with:
          name: explicit-demo-site
          path: .test-artifacts/site
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-web.txt
      - run: npm ci --ignore-scripts
      - run: npm test && npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance
          path: .test-artifacts/browser-acceptance
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ruff==0.16.10
      - run: python -m ruff check config.py launch.py main.py core emotion modules hardware reports utils web cloud scripts tests
      - run: python -m compileall -q config.py launch.py main.py core emotion modules hardware reports utils web cloud scripts tests
      - run: npm run lint
  dependency-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --disable-pip --no-deps -r constraints-web.txt
      - run: npm audit --audit-level=high
  client-h5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-web.txt
      - run: npm ci --ignore-scripts
      - run: npm --prefix apps/client ci --ignore-scripts
      - run: npm run client:audit
      - run: npm run client:typecheck && npm run client:test && npm run client:build:h5
      - run: npx playwright install --with-deps chromium
      - run: npm run client:test:e2e
      - run: npm run client:test:media
      - run: npm run client:test:community
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-platform-h5-evidence
          path: |
            apps/client/dist
            .test-artifacts/v2-client-acceptance
            .test-artifacts/v2-media-acceptance
            .test-artifacts/community-acceptance
            .test-artifacts/client-dependency-audit.json
            .test-artifacts/client-dependency-policy.json
  client-h5-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      CF_PAGES: '1'
      PUBLIC_DEMO_ONLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-web.txt
      - run: npm ci --ignore-scripts
      - run: npm --prefix apps/client ci --ignore-scripts
      - run: npm run client:build:h5
      - run: npx playwright install --with-deps chromium
      - run: npm run client:test:e2e -- --demo-only
      - run: npm run client:test:media -- --demo-only
      - run: npm run client:test:community -- --demo-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-device-demo-preview-evidence
          path: |
            apps/client/dist
            .test-artifacts/v2-client-acceptance
            .test-artifacts/v2-media-acceptance
            .test-artifacts/community-acceptance
  cloud-metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r cloud/api/requirements-cloud.txt pytest==9.1.1
      - run: mkdir -p .test-artifacts
      - run: python -m pytest tests/cloud tests/cloud_tools -q -p no:cacheprovider --basetemp .test-artifacts/cloud-pytest
      - run: python scripts/cloud_schema.py
      - run: python scripts/cloud_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-metadata-package
          path: |
            .test-artifacts/cloudbase-phase04/sc-v2-api.zip
            .test-artifacts/cloudbase-phase04/sc-v2-api.manifest.json
  client-wechat-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/client ci --ignore-scripts
      - run: npm run client:typecheck
      - run: npm run client:build:weapp
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-build-for-owner-devtools
          path: apps/client/dist-weapp
